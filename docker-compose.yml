services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: zaheen
      POSTGRES_USER: zaheen
      POSTGRES_PASSWORD: zaheen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaheen"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: ["zaheen", "serve"]
    env_file: .env
    environment:
      ZAHEEN_DATABASE_URL: postgresql+asyncpg://zaheen:zaheen@postgres:5432/zaheen
      ZAHEEN_LOG_JSON: "true"
    ports:
      - "8000:8000"
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["zaheen", "worker"]
    env_file: .env
    environment:
      ZAHEEN_DATABASE_URL: postgresql+asyncpg://zaheen:zaheen@postgres:5432/zaheen
      ZAHEEN_LOG_JSON: "true"
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2

volumes:
  pgdata:
  data:
