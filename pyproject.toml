[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "zaheendata"
version = "0.1.0"
description = "Enterprise business-directory extraction engine: collect, resolve, enrich, score and shortlist SMBs by NAICS sub-sector."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "tenacity>=8.3",
  "rapidfuzz>=3.9",
  "phonenumbers>=8.13",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
browser = ["playwright>=1.44"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
  "types-python-dateutil",
]

[project.scripts]
zaheen = "zaheendata.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/zaheendata"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008", "SIM108", "B904"]

[tool.ruff.lint.per-file-ignores]
# regex pattern tables read better on one line each
"src/zaheendata/enrich/website.py" = ["E501"]
"src/zaheendata/enrich/reviews.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["zaheendata"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
