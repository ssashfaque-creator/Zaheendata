    scripts: ["app\\.ecwid\\.com", "ecwid\\.com/script"]
  - name: Wix Stores
    category: ecommerce
    html: ["wixstores", "wix-stores"]
  - name: Faire
    category: wholesale
    domains: ["faire.com"]

