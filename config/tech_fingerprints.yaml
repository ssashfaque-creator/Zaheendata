# Wappalyzer-style fingerprints evaluated against the crawled website (HTML, script src,
# link href, meta tags, cookies/headers). Each technology has a category; the "uses several
# separate tools" signal counts distinct categories. Patterns are case-insensitive regexes.
#
#   html     : matched against the raw HTML of any crawled page
#   scripts  : matched against <script src> URLs
#   headers  : matched against "Header-Name: value" lines
#   domains  : matched against hostnames of any link / script / iframe on the page

technologies:
  # ---- payments -----------------------------------------------------------
  - name: Square
    category: payments
    scripts: ["squareup\\.com", "squarecdn\\.com", "js\\.squareup\\.com"]
    html: ["squareup\\.com/(appointments|store|checkout|gift)", "square-online"]
    domains: ["squareup.com", "square.site", "square.link"]
  - name: Stripe
    category: payments
    scripts: ["js\\.stripe\\.com"]
    html: ["buy\\.stripe\\.com", "checkout\\.stripe\\.com"]
  - name: PayPal
    category: payments
    scripts: ["paypal\\.com/sdk", "paypalobjects\\.com"]
    html: ["paypal\\.com/(cgi-bin|donate|ncp)", "paypal\\.me/"]
  - name: Clover
    category: payments
    domains: ["clover.com"]
    html: ["clover\\.com/online-ordering", "clover\\.com/pay"]
  - name: Affirm
    category: financing
    scripts: ["cdn1\\.affirm\\.com"]
  - name: Wisetack
    category: financing
    html: ["wisetack"]
  - name: GreenSky
    category: financing
    html: ["greensky"]

  # ---- ecommerce ----------------------------------------------------------
  - name: Shopify
    category: ecommerce
    scripts: ["cdn\\.shopify\\.com", "shopifycloud"]
    html: ["Shopify\\.theme", "myshopify\\.com", "cdn\\.shopify\\.com"]
    headers: ["x-shopid", "x-shopify-stage"]
  - name: WooCommerce
    category: ecommerce
    html: ["woocommerce", "wc-ajax", "wp-content/plugins/woocommerce"]
  - name: BigCommerce
    category: ecommerce
    html: ["cdn\\d*\\.bigcommerce\\.com", "bigcommerce\\.com"]
  - name: Etsy
